<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意味不短文 可変文字グリッド</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: #e8e6df;
  font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.char {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  user-select: none;
  transition: opacity 0.4s linear;
}

#overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 13, 18, 0.85);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

#overlay .menu {
  text-align: center;
}

#overlay button {
  margin: 8px;
  padding: 6px 14px;
  background: #1a1d26;
  color: #e8e6df;
  border: 1px solid #333;
}
</style>
</head>

<body>
<div id="stage"></div>

<div id="overlay" hidden>
  <div class="menu">
    <h2>Menu</h2>
    <button id="resume">再開</button>
    <button id="reset">リセット</button>
  </div>
</div>

<script>
/* =========================
 * 基本設定
 * ========================= */

const CELL = 16;
const SIZES = [1, 2, 4, 8];
const LIFETIME = 8000;
const TICK = 10;

const stage = document.getElementById("stage");

/* =========================
 * グリッド管理
 * ========================= */

let cols = 0;
let rows = 0;
let grid = [];

function initGrid() {
  cols = Math.floor(innerWidth / CELL);
  rows = Math.floor(innerHeight / CELL);
  grid = Array.from({ length: rows }, () => Array(cols).fill(null));
  stage.innerHTML = "";
}

function canPlace(x, y, size) {
  if (x + size > cols || y + size > rows) return false;

  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      if (grid[y + dy][x + dx]) return false;
    }
  }
  return true;
}

function occupy(x, y, size, el) {
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      grid[y + dy][x + dx] = el;
    }
  }
}

function release(el) {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === el) grid[y][x] = null;
    }
  }
}

function hasEmptyCell() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!grid[y][x]) return true;
    }
  }
  return false;
}

/* =========================
 * 単語生成
 * ========================= */

let wordData = null;
let charQueue = [];

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function renderStructure(template) {
  return template.replace(/\{(\w+)\}/g, (_, key) => {
    const pool = wordData[key + "s"] || wordData[key];
    return pool ? pick(pool) : "";
  });
}

function generateSentence() {
  const base = renderStructure(pick(wordData.structures));
  if (Math.random() < 0.5) {
    return base + " " + renderStructure(pick(wordData.structures));
  }
  return base;
}

function refillCharQueue() {
  charQueue.push(...generateSentence().split(""));
}

/* =========================
 * 文字生成
 * ========================= */

function createCharElement(ch, gx, gy, size) {
  const el = document.createElement("div");
  el.className = "char";
  el.textContent = ch;

  const px = size * CELL;

  el.style.width = px + "px";
  el.style.height = px + "px";
  el.style.left = gx * CELL + "px";
  el.style.top = gy * CELL + "px";
  el.style.fontSize = px * 0.85 + "px";
  el.style.writingMode =
    Math.random() < 0.35 ? "vertical-rl" : "horizontal-tb";

  stage.appendChild(el);
  occupy(gx, gy, size, el);

  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => {
      release(el);
      el.remove();
    }, 400);
  }, LIFETIME);
}

/* =========================
 * 1ステップ描画
 * ========================= */

function tickOnce() {
  if (!wordData) return false;

  if (charQueue.length === 0) {
    refillCharQueue();
  }

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) continue;

      const ch = charQueue.shift();
      if (!ch) return false;

      const sizes = [...SIZES].sort(() => Math.random() - 0.5);
      for (const size of sizes) {
        if (canPlace(x, y, size)) {
          createCharElement(ch, x, y, size);
          return true;
        }
      }
      return false;
    }
  }
  return false;
}

/* =========================
 * 初期高速充填
 * ========================= */

function fastFillInitial() {
  let guard = cols * rows * 2;
  while (hasEmptyCell() && guard-- > 0) {
    tickOnce();
  }
}

/* =========================
 * 通常ループ
 * ========================= */

function tick() {
  tickOnce();
}

/* =========================
 * 起動処理
 * ========================= */

async function start() {
  const res = await fetch("../words.json");
  wordData = await res.json();

  initGrid();
  fastFillInitial();
  setInterval(tick, TICK);
}

addEventListener("resize", initGrid);
start();

</script>
</body>
</html>
