<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意味不短文 グリッド詰め</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: #e8e6df;
  font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* グリッド単位のブロック */
.block {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  line-height: 1.5;
  letter-spacing: 0.05em;
  overflow: hidden;

  transition: opacity 0.4s ease;
}
</style>
</head>

<body>
<div id="stage"></div>

<script>
/* ===== 設定 ===== */

const CELL = 16; // 1グリッドのpx（小さくするほど密）
const BLOCK_SIZES = [4, 2, 1]; // 優先サイズ
const LIFETIME = 6000; // ms

const stage = document.getElementById("stage");

/* ===== グリッド管理 ===== */

let cols, rows;
let grid = []; // true = 使用中

function initGrid() {
  cols = Math.floor(window.innerWidth / CELL);
  rows = Math.floor(window.innerHeight / CELL);
  grid = Array.from({ length: rows }, () =>
    Array(cols).fill(null)
  );
  stage.innerHTML = "";
}

function canPlace(x, y, size) {
  if (x + size > cols || y + size > rows) return false;
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      if (grid[y + dy][x + dx]) return false;
    }
  }
  return true;
}

function occupy(x, y, size, block) {
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      grid[y + dy][x + dx] = block;
    }
  }
}

function release(block) {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === block) {
        grid[y][x] = null;
      }
    }
  }
}

/* ===== 生成ロジック（流用） ===== */

let wordData = null;

const pick = (a) => a[Math.floor(Math.random() * a.length)];

function renderStructure(tpl) {
  return tpl.replace(/\{(\w+)\}/g, (_, k) => {
    const p = wordData[k + "s"] || wordData[k];
    return p ? pick(p) : "";
  });
}

function generateSentence() {
  const s = renderStructure(pick(wordData.structures));
  return Math.random() < 0.4
    ? s + " " + renderStructure(pick(wordData.structures))
    : s;
}

/* ===== 配置 ===== */

function createBlock(size, gx, gy) {
  const el = document.createElement("div");
  el.className = "block";
  el.textContent = generateSentence();

  const vertical = Math.random() < 0.3;
  el.style.writingMode = vertical ? "vertical-rl" : "horizontal-tb";

  const px = size * CELL;
  el.style.width = px + "px";
  el.style.height = px + "px";
  el.style.left = gx * CELL + "px";
  el.style.top = gy * CELL + "px";

  el.style.fontSize =
    (size <= 1 ? 0.6 :
     size === 2 ? 0.9 : 1.2) + "rem";

  stage.appendChild(el);
  occupy(gx, gy, size, el);

  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => {
      release(el);
      el.remove();
    }, 400);
  }, LIFETIME);
}

/* ===== メインループ ===== */

function tick() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) continue;

      for (const size of BLOCK_SIZES) {
        if (canPlace(x, y, size)) {
          createBlock(size, x, y);
          return;
        }
      }
      return;
    }
  }
}

/* ===== 起動 ===== */

async function start() {
  const res = await fetch("../words.json");
  wordData = await res.json();
  initGrid();
  setInterval(tick, 120);
}

window.addEventListener("resize", () => {
  initGrid();
});

start();
</script>
</body>
</html>
