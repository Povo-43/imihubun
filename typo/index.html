<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意味不短文 グリッド（一マス一文字）</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: #e8e6df;
  font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* 1マス = 1文字 */
.block {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;

  line-height: 1;
  overflow: hidden;
  user-select: none;

  transition: opacity 0.4s ease;
}
</style>
</head>

<body>
<div id="stage"></div>

<script>
/* ===== 設定 ===== */

const CELL = 16;        // 1文字1マスのpx
const LIFETIME = 6000; // ms
const TICK_MS = 40;

const stage = document.getElementById("stage");

/* ===== グリッド管理 ===== */

let cols, rows;
let grid = [];

function initGrid() {
  cols = Math.floor(window.innerWidth / CELL);
  rows = Math.floor(window.innerHeight / CELL);
  grid = Array.from({ length: rows }, () =>
    Array(cols).fill(null)
  );
  stage.innerHTML = "";
}

function occupy(x, y, el) {
  grid[y][x] = el;
}

function release(el) {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === el) {
        grid[y][x] = null;
      }
    }
  }
}

/* ===== 単語生成 ===== */

let wordData = null;
let charQueue = [];

const pick = (a) => a[Math.floor(Math.random() * a.length)];

function renderStructure(tpl) {
  return tpl.replace(/\{(\w+)\}/g, (_, k) => {
    const p = wordData[k + "s"] || wordData[k];
    return p ? pick(p) : "";
  });
}

function generateSentence() {
  const s = renderStructure(pick(wordData.structures));
  return Math.random() < 0.4
    ? s + " " + renderStructure(pick(wordData.structures))
    : s;
}

function refillQueue() {
  const sentence = generateSentence();
  charQueue.push(...sentence.split(""));
}

/* ===== 1文字配置 ===== */

function createCharBlock(ch, gx, gy) {
  const el = document.createElement("div");
  el.className = "block";
  el.textContent = ch;

  el.style.width  = CELL + "px";
  el.style.height = CELL + "px";
  el.style.left = gx * CELL + "px";
  el.style.top  = gy * CELL + "px";
  el.style.fontSize = "0.75rem";

  stage.appendChild(el);
  occupy(gx, gy, el);

  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => {
      release(el);
      el.remove();
    }, 400);
  }, LIFETIME);
}

/* ===== メインループ ===== */

function tick() {
  if (!wordData) return;

  if (charQueue.length === 0) {
    refillQueue();
  }

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) continue;

      const ch = charQueue.shift();
      if (!ch) return;

      createCharBlock(ch, x, y);
      return;
    }
  }
}

/* ===== 起動 ===== */

async function start() {
  const res = await fetch("../words.json");
  wordData = await res.json();

  initGrid();
  setInterval(tick, TICK_MS);
}

window.addEventListener("resize", initGrid);

start();
</script>
</body>
</html>
