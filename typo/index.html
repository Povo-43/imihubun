<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意味不短文 可変文字グリッド</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: #e8e6df;
  font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.char {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  user-select: none;
  transition: opacity 0.4s linear;
}
</style>
</head>

<body>
<div id="stage"></div>

<script>
  /* ===== 基本設定 ===== */

const CELL = 16;
const SIZES = [1, 2, 4, 8];
const LIFETIME = 7000;
const TICK = 10;

const stage = document.getElementById("stage");

/* ===== グリッド ===== */

let cols, rows, grid;

function initGrid() {
  cols = Math.floor(innerWidth / CELL);
  rows = Math.floor(innerHeight / CELL);
  grid = Array.from({ length: rows }, () =>
    Array(cols).fill(null)
  );
  stage.innerHTML = "";
}

function canPlace(x, y, s) {
  if (x + s > cols || y + s > rows) return false;
  for (let dy = 0; dy < s; dy++) {
    for (let dx = 0; dx < s; dx++) {
      if (grid[y + dy][x + dx]) return false;
    }
  }
  return true;
}

function occupy(x, y, s, el) {
  for (let dy = 0; dy < s; dy++) {
    for (let dx = 0; dx < s; dx++) {
      grid[y + dy][x + dx] = el;
    }
  }
}

function release(el) {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x] === el) grid[y][x] = null;
    }
  }
}

function hasEmptyCell() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!grid[y][x]) return true;
    }
  }
  return false;
}

/* ===== 単語生成 ===== */

let wordData;
let charQueue = [];

const pick = a => a[Math.floor(Math.random() * a.length)];

function renderStructure(t) {
  return t.replace(/\{(\w+)\}/g, (_, k) => {
    const p = wordData[k + "s"] || wordData[k];
    return p ? pick(p) : "";
  });
}

function generateSentence() {
  const s = renderStructure(pick(wordData.structures));
  return Math.random() < 0.5
    ? s + " " + renderStructure(pick(wordData.structures))
    : s;
}

function refillChars() {
  charQueue.push(...generateSentence().split(""));
}

/* ===== 文字生成 ===== */

function createChar(ch, gx, gy, size) {
  const el = document.createElement("div");
  el.className = "char";
  el.textContent = ch;

  const px = size * CELL;
  el.style.width  = px + "px";
  el.style.height = px + "px";
  el.style.left   = gx * CELL + "px";
  el.style.top    = gy * CELL + "px";
  el.style.fontSize = (px * 0.85) + "px";

  const vertical = Math.random() < 0.35;
  el.style.writingMode = vertical ? "vertical-rl" : "horizontal-tb";

  stage.appendChild(el);
  occupy(gx, gy, size, el);

  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => {
      release(el);
      el.remove();
    }, 400);
  }, LIFETIME);
}

/* ===== 1ステップ描画 ===== */

function tickOnce() {
  if (!wordData) return false;

  if (charQueue.length === 0) refillChars();

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) continue;

      const ch = charQueue.shift();
      if (!ch) return false;

      for (const s of SIZES.sort(() => Math.random() - 0.5)) {
        if (canPlace(x, y, s)) {
          createChar(ch, x, y, s);
          return true;
        }
      }
      return false;
    }
  }
  return false;
}

/* ===== 初期高速充填 ===== */

function fastFillInitial() {
  let guard = cols * rows * 2;
  while (hasEmptyCell() && guard-- > 0) {
    tickOnce();
  }
}

/* ===== 通常ループ ===== */

function tick() {
  tickOnce();
}

/* ===== 起動 ===== */

async function start() {
  const res = await fetch("../words.json");
  wordData = await res.json();

  initGrid();

  // 初期のみ高速で全画面充填
  fastFillInitial();

  // 通常速度に移行
  setInterval(tick, TICK);
}

addEventListener("resize", initGrid);
start();

</script>
</body>
</html>
