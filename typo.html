<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>意味不短文タイポグリッド</title>

<style>
:root {
  --bg: #0b0d12;
  --fg: #e8e6df;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
}

/* 画面全体をグリッドにする */
#grid {
  display: grid;
  width: 100vw;
  height: 100vh;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  grid-auto-rows: minmax(120px, auto);
}

/* 各セル */
.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  text-align: center;

  line-height: 1.7;
  letter-spacing: 0.05em;
  word-break: break-word;
  overflow-wrap: anywhere;

  transition: opacity 0.6s ease;
  opacity: 0;
}

/* 表示中 */
.cell.show {
  opacity: 1;
}

/* 縦書き */
.vertical {
  writing-mode: vertical-rl;
}

/* 横書き */
.horizontal {
  writing-mode: horizontal-tb;
}
</style>
</head>

<body>
<div id="grid"></div>

<script>
let wordData = null;

/* ===== 既存ロジックそのまま ===== */

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function renderStructure(template) {
  return template.replace(/\{(\w+)\}/g, (_, key) => {
    const pool = wordData[key + "s"] || wordData[key];
    if (!pool) return "";
    return pick(pool);
  });
}

function generateSentence() {
  const structure = pick(wordData.structures);
  const sentence = renderStructure(structure);

  // 低確率で2文
  return Math.random() < 0.4
    ? sentence + " " + renderStructure(pick(wordData.structures))
    : sentence;
}

/* ===== 表示用ロジック ===== */

const grid = document.getElementById("grid");
let cells = [];

function setupGrid() {
  grid.innerHTML = "";
  cells = [];

  const cellCount =
    Math.floor(window.innerWidth / 240) *
    Math.floor(window.innerHeight / 140);

  for (let i = 0; i < cellCount; i++) {
    const div = document.createElement("div");
    div.className = "cell";
    grid.appendChild(div);
    cells.push(div);
  }
}

function updateCell(cell) {
  cell.classList.remove("show");

  setTimeout(() => {
    cell.textContent = generateSentence();

    // 縦横ランダム
    cell.classList.toggle("vertical", Math.random() < 0.3);
    cell.classList.toggle("horizontal", !cell.classList.contains("vertical"));

    // サイズ変化
    cell.style.fontSize =
      (Math.random() * 0.6 + 0.8).toFixed(2) + "rem";

    cell.classList.add("show");
  }, 400);
}

function startLoop() {
  cells.forEach((cell, i) => {
    setTimeout(() => {
      updateCell(cell);
      setInterval(() => updateCell(cell), 4000 + Math.random() * 3000);
    }, i * 120);
  });
}

/* ===== words.json 読み込み ===== */

async function loadWords() {
  try {
    const res = await fetch("words.json");
    wordData = await res.json();
    setupGrid();
    startLoop();
  } catch (e) {
    document.body.innerText = "words.jsonの読み込みに失敗しました。";
  }
}

window.addEventListener("resize", () => {
  if (!wordData) return;
  setupGrid();
  startLoop();
});

loadWords();
</script>
</body>
</html>
